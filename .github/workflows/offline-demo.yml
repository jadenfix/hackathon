name: Offline demo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  provider-free-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install media decoder
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends ffmpeg
      - run: python -m pip install --requirement requirements-api-offline.txt
      - run: python -m pytest -q hackathon/tests/test_offline_cycle.py hackathon/tests/test_offline_cli.py hackathon/tests/test_api_offline_cycle.py
      - name: Run documented workflow
        run: >-
          python main.py --mode gridpilot --simulate 1 --seed 8257
          --as-of 2026-10-13T00:00:00Z
          --receipt artifacts/offline-cycle.json
      - name: Verify deterministic receipt
        run: |
          cp artifacts/offline-cycle.json /tmp/first.json
          python main.py --mode gridpilot --simulate 1 --seed 8257 \
            --as-of 2026-10-13T00:00:00Z \
            --receipt artifacts/offline-cycle.json
          diff -u /tmp/first.json artifacts/offline-cycle.json
          git diff --exit-code
      - name: Verify published demo
        run: python scripts/verify_offline_demo.py
